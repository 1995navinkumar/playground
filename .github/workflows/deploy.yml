name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Grant permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm" # Change to pnpm or yarn if using a different package manager

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          BASE_URL: /${{ github.event.repository.name }}/
        run: npm run build

      # 1. TELL GITHUB TO PACK THE dist FOLDER
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist" # <--- Point this directly to Vite's output folder

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 2. DEPLOY THE PACKED ARTIFACT TO GITHUB PAGES
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
